[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blackjack-app"
version = "2.0.0"
description = "A Blackjack game with a Tkinter GUI and a console mode."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
blackjack = "blackjack.__main__:main"

[tool.setuptools]
packages = ["blackjack"]

[tool.setuptools.package-data]
blackjack = ["assets/playing_cards/*.png"]

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tk and a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run tests (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -v
      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest discover -v
      - name: Install package
        run: python -m pip install . && python -c "import blackjack.gui as g; assert len(list(g.CARD_IMAGES_DIR.glob('*.png'))) == 52"
